<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Seed Produk - Citra Snack</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            font-family: "Poppins", sans-serif;
            background: #fffdf9;
        }

        .seed-container {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .seed-card {
            width: 100%;
            max-width: 600px;

            padding: 35px;

            background: #ffffff;

            border: 1px solid #f0e4c8;
            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(180, 130, 40, 0.08);
        }

        .seed-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #fff3d2;
            color: #e9a008;

            font-size: 28px;
        }

        h1 {
            margin-bottom: 10px;

            text-align: center;

            font-size: 24px;
            font-weight: 700;

            color: #292929;
        }

        .description {
            margin-bottom: 25px;

            text-align: center;

            color: #888;

            font-size: 13px;
            line-height: 1.7;
        }

        .product-list {
            margin-bottom: 25px;
        }

        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 14px;

            margin-bottom: 8px;

            background: #fffaf0;

            border: 1px solid #f1dfb4;
            border-radius: 9px;
        }

        .product-name {
            color: #444;

            font-size: 13px;
            font-weight: 500;
        }

        .product-price {
            color: #d99200;

            font-size: 12px;
            font-weight: 600;
        }

        #seedButton {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 9px;

            background: #f0a500;
            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        #seedButton:hover {
            background: #d99200;
        }

        #seedButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;

            padding: 13px;

            border-radius: 9px;

            font-size: 12px;

            display: none;
        }

        .status-loading {
            display: block;

            background: #fff8e7;
            color: #806a3e;
        }

        .status-success {
            display: block;

            background: #eefaf0;
            color: #357a42;
        }

        .status-error {
            display: block;

            background: #fff1f1;
            color: #c0392b;
        }

        .status-item {
            margin-top: 5px;
        }

    </style>

</head>


<body>


<div class="seed-container">

    <div class="seed-card">


        <div class="seed-icon">

            <i class="bi bi-database-add"></i>

        </div>


        <h1>
            Seed Produk Citra Snack
        </h1>


        <p class="description">

            Klik tombol di bawah untuk memasukkan
            produk awal ke Firebase Firestore.

        </p>


        <!-- =========================
             DAFTAR PRODUK
        ========================== -->

        <div
            id="productList"
            class="product-list">
        </div>


        <!-- =========================
             BUTTON
        ========================== -->

        <button
            type="button"
            id="seedButton">

            <i class="bi bi-cloud-upload"></i>

            Tambahkan Semua Produk

        </button>


        <!-- =========================
             STATUS
        ========================== -->

        <div id="status"></div>


    </div>

</div>


<script
    type="module"
    src="/assets/js/seed-products.js">
</script>


</body>

</html>
